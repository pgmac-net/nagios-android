# Only what the code uses. A library arrives in the milestone that first needs it.
# Every entry here is licence-checked (Licensee), denylist-checked and locked.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
licensee = "1.14.1"
cyclonedx = "3.5.1"
kover = "0.9.11"
junit = "4.13.2"
robolectric = "4.17"
androidxTestExtJunit = "1.3.0"
okhttp = "5.5.1"
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"
room = "2.8.5"
navigation = "2.10.2"
lifecycle = "2.11.0"
hiltCompose = "1.4.0"
datastore = "1.3.0"
work = "2.12.0"
glance = "1.2.0"
jazzer = "0.30.0"

# Security floors. None of these is a dependency of the app, and none is in the APK.
# They are libraries that build tools bring with them (the Android Gradle plugin, its
# lint tool, ktlint, the CycloneDX plugin) where the tool's latest release still asks for
# a version with a known vulnerability. The build raises them to these versions; see the "floor-"
# libraries below and docs/development.md. Each can go once its tool catches up.
floorBouncycastle = "1.86"
floorCommonsLang3 = "3.21.0"
floorFreemarker = "2.3.35"
floorHttpclient = "4.5.14"
floorJackson = "2.22.4"
floorJdom2 = "2.0.6.1"
floorJose4j = "0.9.7"
floorLogback = "1.5.34"
floorPlexusUtils = "3.6.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltCompose" }

# Fuzzing. Test-only: neither is in the APK. See docs/development.md, "Fuzzing".
jazzer = { module = "com.code-intelligence:jazzer", version.ref = "jazzer" }

# Gradle plugins: not dependencies of the app. build-logic compiles against them; the build
# applies them by id, at the versions in [plugins] below.
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }

# Security floors (see the versions above). Bouncy Castle, Jackson and logback are each a family
# released together, so every member in use is raised, not only the one with the advisory.
floor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "floorBouncycastle" }
floor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "floorBouncycastle" }
floor-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "floorBouncycastle" }
floor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "floorCommonsLang3" }
floor-freemarker = { module = "org.freemarker:freemarker", version.ref = "floorFreemarker" }
floor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "floorHttpclient" }
floor-jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "floorJackson" }
floor-jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "floorJackson" }
floor-jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "floorJackson" }
floor-jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "floorJackson" }
floor-jdom2 = { module = "org.jdom:jdom2", version.ref = "floorJdom2" }
floor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "floorJose4j" }
floor-logback-core = { module = "ch.qos.logback:logback-core", version.ref = "floorLogback" }
floor-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "floorLogback" }
floor-plexus-utils = { module = "org.codehaus.plexus:plexus-utils", version.ref = "floorPlexusUtils" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
