# The job names below (build, lint, foss) are REQUIRED STATUS CHECKS on main,
# configured in pgmac-net/terraform-github (config/repos.yaml, nagios-android).
# Renaming or removing a job here without changing that first blocks every merge.
#
# GitHub-hosted runners only. This is a public repo: fork PRs must never run on
# self-hosted infrastructure.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gradle/wrapper/gradle-wrapper.jar is a binary in the repository, and it runs on every
      # build. This checks it against the checksums Gradle publishes, before anything runs it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Must match JAVA_TOOLCHAIN in build-logic (KotlinQualityPlugin). Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug and release, run unit tests, write the coverage report
        run: |
          ./gradlew --console=plain assembleDebug assembleRelease testDebugUnitTest :nagios:test :app:koverXmlReportApp
          # The signed release must not gain the debug indicator (docs/development.md, "Debug builds").
          # Only the tests about the release build run here; the rest are written against debug.
          ./gradlew --console=plain testReleaseUnitTest

      # Coverage is information, not a gate (codecov.yml). A Codecov outage must not cost a merge.
      # No token on a fork's pull request: secrets are not passed to it, and the step says so and moves on.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/kover/reportApp.xml
          fail_ci_if_error: false
          disable_search: true

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nagwatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            nagios/build/reports/tests/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Must match JAVA_TOOLCHAIN in build-logic (KotlinQualityPlugin). Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ktlint, detekt, Android Lint, SPDX headers, README badges
        run: ./gradlew --console=plain --continue ktlintCheck detekt lintDebug checkSpdxHeaders checkReadmeBadges

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            app/build/reports/
            nagios/build/reports/
          retention-days: 14

  foss:
    name: foss
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Must match JAVA_TOOLCHAIN in build-logic (KotlinQualityPlugin). Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Licence allowlist and dependency denylist
        run: ./gradlew --console=plain --continue licensee checkFossDependencies

      - name: Self-test (the checks must reject a banned dependency)
        run: scripts/foss-self-test.sh
