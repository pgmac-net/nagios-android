# Static analysis with CodeQL. Results appear under Security > Code scanning.
# Not a required check: it must not be able to block a merge by being slow or
# by not yet supporting a new Kotlin release.
#
# GitHub-hosted runners only. This is a public repo: fork PRs must never run on
# self-hosted infrastructure.
name: CodeQL

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 16 * * 0" # 02:30 AEST Monday: new queries find old code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin is analysed by watching a real compilation, so this one builds the app.
          - language: java-kotlin
            build-mode: manual
          # The workflows themselves.
          - language: actions
            build-mode: none
          # scripts/ (the fixture sanitiser).
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # Must match JAVA_TOOLCHAIN in build-logic (KotlinQualityPlugin). Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "25"

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Reads the cache of Gradle itself and of downloaded libraries, so the job does not
          # depend on fetching them every time. It restores no compiled output: the checkout
          # is fresh, and the build below runs with the build cache off.
          cache-read-only: true

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile the app where CodeQL can watch
        if: matrix.build-mode == 'manual'
        # No daemon and no build cache: every compiler has to actually run, in this process tree.
        run: ./gradlew --console=plain --no-daemon --no-build-cache :app:assembleDebug

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
