# Static analysis with CodeQL. Results appear under Security > Code scanning.
# Not a required check: it must not be able to block a merge by being slow or
# by not yet supporting a new Kotlin release.
#
# GitHub-hosted runners only. This is a public repo: fork PRs must never run on
# self-hosted infrastructure.
name: CodeQL

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 16 * * 0" # 02:30 AEST Monday: new queries find old code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin is analysed by watching a real compilation, so this one builds the app.
          - language: java-kotlin
            build-mode: manual
          # The workflows themselves.
          - language: actions
            build-mode: none
          # scripts/ (the fixture sanitiser).
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Must match jvmToolchain() in app/build.gradle.kts. Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "21"

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A compilation restored from a cache is one CodeQL never saw.
          cache-disabled: true

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile the app where CodeQL can watch
        if: matrix.build-mode == 'manual'
        # No daemon and no build cache: every compiler has to actually run, in this process tree.
        run: ./gradlew --console=plain --no-daemon --no-build-cache :app:assembleDebug

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
