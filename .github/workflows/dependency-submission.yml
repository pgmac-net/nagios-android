# Sends the resolved Gradle dependency graph to GitHub so Dependabot alerts
# cover real (transitive) dependencies. Not a required check.
name: Dependency submission

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Must match JAVA_TOOLCHAIN in build-logic (KotlinQualityPlugin). Renovate does not
          # raise major bumps for this on its own (see renovate.json).
          java-version: "21"

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
