# OpenSSF Scorecard, via the shared pgmac-net workflow. Not a required check.
name: Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 16 * * 0" # 02:00 AEST Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    uses: pgmac-net/pg-actions/.github/workflows/scorecard-public.yml@d3a732bb8777bd5cebd5cd3e406e06a4a6e033ac # main
    permissions:
      security-events: write
      contents: read
      actions: read
