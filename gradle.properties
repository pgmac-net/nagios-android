# Nagwatch's version, in one place: the app's versionName and versionCode, and the version every
# module carries, so the release SBOM names :nagios at the same version as the app. Raised by the
# release pull request (docs/development.md, "Releasing"). versionCode only ever goes up.
nagwatch.versionName=0.4.0
nagwatch.versionCode=6
