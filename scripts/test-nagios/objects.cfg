define service {
    host_name                       db01
    service_description             Replication
    check_command                   nagwatch_dummy!2!REPLICATION CRITICAL - made up
    max_check_attempts              1
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           0
    notification_period             24x7
    notifications_enabled           0
    contacts                        operator
}
