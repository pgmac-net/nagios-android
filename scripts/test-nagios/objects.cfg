#
# Objects for the throwaway test Nagios (scripts/test-nagios/start.sh). Everything here is
# made up. States are fixed by check_dummy, so the same things are always wrong.
#
# Three users (passwords are in start.sh; they are not secrets):
#   operator  may send any command                     (cgi.cfg: authorized_for_all_*_commands)
#   viewer    sees everything and is read-only         (cgi.cfg: authorized_for_read_only)
#   limited   sees everything, but may only command the objects it is a contact for: web01
#             and web01's services. Asking it to command db01 is how "not authorised for this
#             object" is produced.

define command {
    command_name    nagwatch_dummy
    command_line    $USER1$/check_dummy $ARG1$ "$ARG2$"
}

define contact {
    contact_name                    operator
    alias                           Test Operator
    use                             generic-contact
    email                           operator@example.invalid
}

define contact {
    contact_name                    viewer
    alias                           Test Viewer
    use                             generic-contact
    email                           viewer@example.invalid
}

define contact {
    contact_name                    limited
    alias                           Test Limited
    use                             generic-contact
    email                           limited@example.invalid
}

define host {
    host_name                       web01
    alias                           web01
    address                         192.0.2.10
    check_command                   nagwatch_dummy!0!PING OK - made up
    max_check_attempts              3
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           0
    notification_period             24x7
    notifications_enabled           0
    contacts                        operator,limited
}

define host {
    host_name                       db01
    alias                           db01
    address                         192.0.2.20
    check_command                   nagwatch_dummy!2!CRITICAL - made up, host is down
    max_check_attempts              1
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           0
    notification_period             24x7
    notifications_enabled           0
    contacts                        operator
}

define service {
    host_name                       web01
    service_description             HTTP
    check_command                   nagwatch_dummy!0!HTTP OK - made up
    max_check_attempts              1
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           0
    notification_period             24x7
    notifications_enabled           0
    contacts                        operator,limited
}

define service {
    host_name                       web01
    service_description             Disk /
    check_command                   nagwatch_dummy!2!DISK CRITICAL - made up, 97% used
    max_check_attempts              1
    check_interval                  1
    retry_interval                  1
    check_period                    24x7
    notification_interval           0
    notification_period             24x7
    notifications_enabled           0
    contacts                        operator,limited
